<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notre réseau</title>
<style>
:root{--bg:#eef2f1;--card:#fff;--tx:#14232b;--mut:#5d6f76;--ac:#0f766e;--acx:#fff;--bd:#d5dfdd;--me:#d9efec}
@media(prefers-color-scheme:dark){:root{--bg:#10191c;--card:#18262b;--tx:#e6eeee;--mut:#97aab0;--ac:#2fb8aa;--acx:#06201d;--bd:#2a3d43;--me:#1d3b3a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:.55rem 1rem;background:var(--ac);color:var(--acx);font-weight:600}
button.ghost{background:none;color:var(--mut);padding:.2rem .5rem;font-weight:400}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input,textarea{width:100%;padding:.6rem .75rem;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
textarea{resize:vertical;min-height:80px}
.hide{display:none!important}
#auth{max-width:380px;margin:0 auto;padding:12vh 1.25rem 2rem}
#auth h1{font-size:1.9rem;margin:0 0 .25rem}
#auth p{color:var(--mut);margin:0 0 1.25rem}
#auth form{display:grid;gap:.7rem}
#msg{min-height:1.4em;color:#c2410c;font-size:.9rem}
#msg.ok{color:var(--ac)}
#app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem;border-bottom:1px solid var(--bd)}
header strong{flex:1;font-size:1.1rem}
nav{display:flex;gap:.25rem;padding:.5rem 1rem 0}
nav button{background:none;color:var(--mut);border-radius:8px 8px 0 0;border-bottom:3px solid transparent}
nav button.on{color:var(--tx);border-color:var(--ac)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
#chat{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.m{max-width:85%;padding:.5rem .8rem;border-radius:12px;background:var(--card);border:1px solid var(--bd);align-self:flex-start;overflow-wrap:anywhere}
.m.me{background:var(--me);align-self:flex-end}
.who{font-size:.8rem;color:var(--mut)}
.bar{display:flex;gap:.5rem;padding:.75rem 1rem;border-top:1px solid var(--bd)}
#wall{flex:1;overflow-y:auto;padding:1rem;display:grid;gap:1rem;align-content:start}
.post{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:1rem}
.post p{margin:.4rem 0 .8rem;white-space:pre-wrap;overflow-wrap:anywhere}
.cm{padding:.35rem 0 .35rem .75rem;border-left:3px solid var(--bd);margin:.3rem 0;overflow-wrap:anywhere}
.cform{display:flex;gap:.5rem;margin-top:.6rem}
.empty{color:var(--mut);text-align:center;padding:2rem 0}
@media(prefers-reduced-motion:no-preference){#chat{scroll-behavior:smooth}}
</style>
</head>
<body>

<section id="auth" class="hide">
  <h1>Notre réseau</h1>
  <p>L’espace de discussion et de publications de l’équipe.</p>
  <form id="f">
    <input id="name" placeholder="Votre nom (affiché aux autres)" autocomplete="name" class="hide">
    <input id="email" type="email" placeholder="E-mail" autocomplete="email" required>
    <input id="pw" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="current-password" minlength="6" required>
    <input id="code" placeholder="Code d’accès de l’équipe" class="hide">
    <button id="go">Se connecter</button>
    <div id="msg" role="status"></div>
  </form>
  <button class="ghost" id="swap" type="button">Pas encore de compte ? Créer un compte</button>
</section>

<div id="app" class="hide">
  <header><strong>Notre réseau</strong><span id="me" class="who"></span><button class="ghost" id="out">Quitter</button></header>
  <nav><button id="t1" class="on">Discussion</button><button id="t2">Publications</button></nav>
  <main>
    <section id="p1" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div id="chat" aria-live="polite"></div>
      <form class="bar" id="cf"><input id="ci" placeholder="Écrire un message" maxlength="1000" autocomplete="off"><button>Envoyer</button></form>
    </section>
    <section id="p2" class="hide" style="flex:1;min-height:0;overflow-y:auto">
      <div id="wall">
        <form class="post" id="pf"><textarea id="pi" placeholder="Partager quelque chose avec l’équipe" maxlength="5000"></textarea><div style="margin-top:.5rem"><button>Publier</button></div></form>
        <div id="posts"></div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://odghpbzjaruupkbligmh.supabase.co';
const SUPABASE_KEY='sb_publishable_r-9HVWtfJJyrcPj4NoCrnw_sxbpvNLa';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
let me=null,isAdmin=false,signup=false,names={},started=false;

function h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
const when=t=>new Date(t).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
const nm=id=>names[id]||'Collègue';
function say(t,ok){const m=$('#msg');m.textContent=t;m.className=ok?'ok':''}

/* Connexion / inscription */
$('#swap').onclick=()=>{
  signup=!signup;
  $('#name').classList.toggle('hide',!signup);$('#code').classList.toggle('hide',!signup);
  $('#name').required=signup;$('#code').required=signup;
  $('#go').textContent=signup?'Créer mon compte':'Se connecter';
  $('#swap').textContent=signup?'J’ai déjà un compte':'Pas encore de compte ? Créer un compte';
  say('');
};
$('#f').onsubmit=async e=>{
  e.preventDefault();say('');
  const email=$('#email').value.trim(),password=$('#pw').value;
  if(signup){
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{name:$('#name').value.trim(),code:$('#code').value.trim()}}});
    if(error)return say(/database error/i.test(error.message)?'Code d’accès incorrect ou inscription refusée.':error.message);
    if(!data.session)return say('Compte créé. Confirmez votre e-mail, puis connectez-vous.',true);
  }else{
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error)return say('E-mail ou mot de passe incorrect.');
  }
};
$('#out').onclick=()=>sb.auth.signOut();
sb.auth.onAuthStateChange((_e,s)=>{
  setTimeout(()=>{ if(s&&s.user){me=s.user;start()}else{me=null;started=false;$('#app').classList.add('hide');$('#auth').classList.remove('hide')} },0);
});

/* Démarrage */
async function start(){
  if(started)return;started=true;
  $('#auth').classList.add('hide');$('#app').classList.remove('hide');
  await loadNames();
  isAdmin=!!(names[me.id]&&adminIds.has(me.id));
  $('#me').textContent=nm(me.id);
  await loadChat();await loadPosts();
  sb.channel('live')
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},async p=>{if(!names[p.new.user_id])await loadNames();addMsg(p.new,true)})
   .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},p=>{const x=document.querySelector('[data-id="'+p.old.id+'"]');if(x)x.remove()})
   .on('postgres_changes',{event:'*',schema:'public',table:'posts'},loadPosts)
   .on('postgres_changes',{event:'*',schema:'public',table:'comments'},loadPosts)
   .subscribe();
}
let adminIds=new Set();
async function loadNames(){
  const {data}=await sb.from('profiles').select('id,name,is_admin');
  (data||[]).forEach(p=>{names[p.id]=p.name;if(p.is_admin)adminIds.add(p.id)});
}

/* Onglets */
function tab(n){
  $('#p1').classList.toggle('hide',n!==1);$('#p2').classList.toggle('hide',n!==2);
  $('#t1').classList.toggle('on',n===1);$('#t2').classList.toggle('on',n===2);
  if(n===1){const c=$('#chat');c.scrollTop=c.scrollHeight}
}
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);

/* Discussion */
function addMsg(m,scroll){
  const c=$('#chat');
  if(document.querySelector('[data-id="'+m.id+'"]'))return;
  const d=h('div','m'+(m.user_id===me.id?' me':''));d.dataset.id=m.id;
  d.append(h('div','who',nm(m.user_id)+', '+when(m.created_at)),h('div','',m.content));
  if(m.user_id===me.id||isAdmin){
    const x=h('button','ghost','Supprimer');
    x.onclick=()=>sb.from('messages').delete().eq('id',m.id).then(()=>d.remove());
    d.append(x);
  }
  const near=c.scrollHeight-c.scrollTop-c.clientHeight<120;
  c.append(d);if(scroll&&(near||m.user_id===me.id))c.scrollTop=c.scrollHeight;
}
async function loadChat(){
  const {data}=await sb.from('messages').select('*').order('created_at',{ascending:false}).limit(80);
  const c=$('#chat');c.replaceChildren();
  (data||[]).reverse().forEach(m=>addMsg(m));
  if(!data||!data.length)c.append(h('div','empty','Aucun message. Écrivez le premier.'));
  c.scrollTop=c.scrollHeight;
}
$('#cf').onsubmit=async e=>{
  e.preventDefault();
  const t=$('#ci').value.trim();if(!t)return;
  $('#ci').value='';
  const e0=document.querySelector('#chat .empty');if(e0)e0.remove();
  const {error}=await sb.from('messages').insert({content:t});
  if(error)alert('Message non envoyé : '+error.message);
};

/* Publications */
async function loadPosts(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('#posts')&&a.value)return;
  const {data}=await sb.from('posts').select('*,comments(*)').order('created_at',{ascending:false}).limit(30);
  const box=$('#posts');box.replaceChildren();
  if(!data||!data.length){box.append(h('div','empty','Aucune publication pour le moment.'));return}
  for(const p of data){
    const d=h('article','post');
    d.append(h('div','who',nm(p.user_id)+', '+when(p.created_at)),h('p','',p.content));
    if(p.user_id===me.id||isAdmin){
      const x=h('button','ghost','Supprimer la publication');
      x.onclick=()=>confirm('Supprimer cette publication ?')&&sb.from('posts').delete().eq('id',p.id);
      d.append(x);
    }
    (p.comments||[]).sort((a,b)=>a.created_at<b.created_at?-1:1).forEach(c=>{
      const k=h('div','cm');k.append(h('div','who',nm(c.user_id)+', '+when(c.created_at)),h('div','',c.content));
      if(c.user_id===me.id||isAdmin){const x=h('button','ghost','Supprimer');x.onclick=()=>sb.from('comments').delete().eq('id',c.id);k.append(x)}
      d.append(k);
    });
    const f=h('form','cform'),i=h('input');i.placeholder='Écrire un commentaire';i.maxLength=1000;
    f.append(i,h('button','','Commenter'));
    f.onsubmit=async e=>{e.preventDefault();const t=i.value.trim();if(!t)return;i.value='';await sb.from('comments').insert({post_id:p.id,content:t})};
    d.append(f);box.append(d);
  }
}
$('#pf').onsubmit=async e=>{
  e.preventDefault();
  const t=$('#pi').value.trim();if(!t)return;
  const {error}=await sb.from('posts').insert({content:t});
  if(error)return alert('Publication non envoyée : '+error.message);
  $('#pi').value='';
};

/* Au chargement */
sb.auth.getSession().then(({data})=>{if(!data.session)$('#auth').classList.remove('hide')});
</script>
</body>
</html>
