<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ray Com 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6eefb;--card:#fff;--tx:#0f1b3d;--mut:#5b6b8c;--ac:#1d4ed8;--acx:#fff;--bd:#cfdaf0;--me:#dbe7ff;--side:#0b2a6f;--st:#c7d6f5;--hi:#f5b942}
@media(prefers-color-scheme:dark){:root{--bg:#0a1430;--card:#111f45;--tx:#e8eeff;--mut:#93a4cc;--ac:#6ea8ff;--acx:#06173d;--bd:#223566;--me:#1a2f63;--side:#071030}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:.55rem 1rem;background:var(--ac);color:var(--acx);font-weight:600}
button.g{background:none;color:var(--mut);padding:.15rem .4rem;font-weight:400;font-size:.8rem}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input,textarea{width:100%;padding:.6rem .75rem;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
textarea{resize:vertical;min-height:80px}
.hide{display:none!important}
.logo{width:38px;height:38px;display:block;flex:none}.logo svg{width:100%;height:100%;display:block}
#auth{max-width:380px;margin:0 auto;padding:10vh 1.25rem 2rem}
#auth .brand{display:flex;align-items:center;gap:.7rem;font-size:1.6rem;font-weight:700;margin-bottom:.4rem}
#auth p{color:var(--mut);margin:0 0 1.25rem}
#auth form{display:grid;gap:.7rem}
#msg{min-height:1.4em;color:#c2410c;font-size:.9rem}#msg.ok{color:var(--ac)}
#app{display:grid;grid-template-columns:230px 1fr;height:100%}
aside{background:var(--side);color:var(--st);display:flex;flex-direction:column;padding:1rem .75rem;gap:.25rem}
aside .brand{display:flex;align-items:center;gap:.6rem;font-weight:700;color:#fff;padding:.2rem .5rem 1rem}
aside nav{display:grid;gap:.2rem}
aside nav button{display:flex;align-items:center;gap:.6rem;text-align:left;background:none;color:inherit;padding:.65rem .75rem;font-weight:500}
aside nav button.on{background:rgba(255,255,255,.12);color:#fff}
.badge{margin-left:auto;background:var(--hi);color:#142033;border-radius:99px;font-size:.75rem;padding:0 .45rem;font-weight:700}
.chip{margin-top:auto;display:flex;align-items:center;gap:.6rem;background:rgba(255,255,255,.08);color:#fff;padding:.5rem;text-align:left;font-weight:500}
main{display:flex;min-height:0;min-width:0}
.pane{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
h2{font-size:1.05rem;margin:0;padding:.9rem 1.25rem;border-bottom:1px solid var(--bd);background:var(--card)}
.msgs{flex:1;overflow-y:auto;padding:1rem 1.25rem;display:flex;flex-direction:column;gap:.6rem}
.m{display:flex;gap:.6rem;max-width:80%;align-self:flex-start}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.mb{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:.4rem .75rem;overflow-wrap:anywhere}
.m.me .mb{background:var(--me)}
.who{font-size:.78rem;color:var(--mut)}
.b{max-width:78%;padding:.45rem .75rem;border-radius:12px;background:var(--card);border:1px solid var(--bd);align-self:flex-start;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--me)}
.bar{display:flex;gap:.5rem;padding:.75rem 1.25rem;border-top:1px solid var(--bd);background:var(--card)}
.bar .em{background:none;font-size:1.3rem;padding:0 .3rem}
#wall{flex:1;overflow-y:auto;padding:1.25rem;display:grid;gap:1rem;align-content:start}
.post{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:1rem}
.ph{display:flex;align-items:center;gap:.6rem}
.post p{margin:.5rem 0 .8rem;white-space:pre-wrap;overflow-wrap:anywhere}
.cm{display:flex;gap:.5rem;padding:.4rem 0;border-top:1px solid var(--bd);overflow-wrap:anywhere}
.cform{display:flex;gap:.5rem;margin-top:.6rem}
.empty{color:var(--mut);text-align:center;padding:2rem 0}
.av{--s:36px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;overflow:hidden;flex:none;color:#fff;font-weight:700;font-size:calc(var(--s)*.42);background:var(--bd)}
.av img{width:100%;height:100%;object-fit:cover}
.av.e{background:var(--me);color:inherit;font-size:calc(var(--s)*.55)}
.dm{display:grid;grid-template-columns:290px 1fr}
#peers{border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;background:var(--card)}
#peers>input{margin:.75rem;width:calc(100% - 1.5rem)}
#pl{overflow-y:auto;flex:1}
.pr{display:flex;align-items:center;gap:.6rem;width:100%;background:none;color:var(--tx);border-radius:0;padding:.55rem .9rem;text-align:left;font-weight:500}
.pr.on{background:var(--me)}
.pr small{display:block;color:var(--mut);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
#conv{display:flex;flex-direction:column;min-height:0;min-width:0}
#ch{display:flex;align-items:center;gap:.6rem;padding:.7rem 1.25rem;border-bottom:1px solid var(--bd);background:var(--card);font-weight:600}
#back{display:none}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(380px,92vw);padding:1.25rem}
dialog::backdrop{background:rgba(0,0,0,.45)}
.er{display:flex;flex-wrap:wrap;gap:.3rem;margin:.5rem 0}
.er button{background:var(--bg);font-size:1.2rem;padding:.2rem .4rem}
#ep{position:fixed;z-index:9;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:272px;padding:6px;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#ep button{background:none;font-size:1.25rem;padding:.2rem}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
h2{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.an{font-weight:800;letter-spacing:-.02em;font-size:1.05rem}
#auth .an{font-size:1.7rem}#auth .logo{width:56px;height:56px}
aside nav button{font-weight:600}
.nm{font-weight:700;color:var(--ac)}
.who{font-weight:500;font-size:.75rem}
.mb,.b{font-size:.95rem}
.pic{display:block;max-width:100%;max-height:320px;border-radius:10px;margin-top:.4rem;cursor:zoom-in;object-fit:cover}
.post .pic{margin:.3rem 0 .8rem}
.pc{font-size:.8rem;color:var(--ac);cursor:pointer;white-space:nowrap;align-self:center;font-weight:600}
#lb{padding:0;border:0;background:none;width:auto;max-width:96vw}
#lb img{max-width:96vw;max-height:92vh;border-radius:8px;display:block}
#lb::backdrop{background:rgba(0,0,0,.82)}
.mlist{flex:1;overflow-y:auto;padding:0 1.25rem 1.25rem;display:grid;gap:.5rem;align-content:start}
.mr{display:flex;align-items:center;gap:.75rem;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:.6rem .8rem;color:var(--tx);text-align:left;width:100%;font-weight:600}
.mr small{display:block;color:var(--mut);font-weight:400}
.tag{background:var(--hi);color:#142033;border-radius:99px;font-size:.68rem;padding:.05rem .5rem;font-weight:700;margin-left:.4rem}
.sm{padding:.3rem .6rem;font-size:.8rem}
.credit{font-size:.72rem;line-height:1.5;color:var(--mut);margin-top:1rem}
.credit a{color:inherit;text-decoration:underline}
aside .credit{color:var(--st);opacity:.85;margin-top:.7rem}
#pd .credit{border-top:1px solid var(--bd);padding-top:.7rem}
@media(max-width:760px){aside .credit{display:none}}
@media(max-width:760px){
 #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
 aside{order:2;flex-direction:row;padding:.3rem;align-items:center}
 aside .brand,.chip span{display:none}
 aside nav{display:flex;flex:1;justify-content:space-around}
 aside nav button{flex-direction:column;gap:0;font-size:.7rem;padding:.3rem .5rem}
 .chip{margin:0;padding:.25rem}
 .m,.b{max-width:92%}
 .dm{grid-template-columns:1fr}
 .dm #conv{display:none}.dm.open #conv{display:flex}.dm.open #peers{display:none}
 #back{display:inline-block;padding:.2rem .6rem}
}
</style>
</head>
<body>

<section id="auth" class="hide">
  <div class="brand"><span class="logo" id="lg0"></span><span class="an"></span></div>
  <p>L’espace de discussion et de publications de l’équipe.</p>
  <form id="f">
    <input id="name" placeholder="Votre nom (affiché aux autres)" autocomplete="name" class="hide">
    <input id="email" type="email" placeholder="E-mail" autocomplete="email" required>
    <input id="pw" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="current-password" minlength="6" required>
    <input id="code" placeholder="Code d’accès de l’équipe" class="hide">
    <button id="go">Se connecter</button>
    <div id="msg" role="status"></div>
  </form>
  <button class="g" id="swap" type="button">Pas encore de compte ? Créer un compte</button>
</section>

<div id="app" class="hide">
  <aside>
    <div class="brand"><span class="logo" id="lg1"></span><span class="an"></span></div>
    <nav>
      <button id="t1" class="on"><span>💬</span>Discussion</button>
      <button id="t2"><span>📰</span>Publications</button>
      <button id="t4"><span>👥</span>Membres</button>
      <button id="t3"><span>✉️</span>Privé<b class="badge hide" id="bd"></b></button>
    </nav>
    <button class="chip" id="chip"></button>
  </aside>
  <main>
    <section id="p1" class="pane">
      <h2>Discussion générale</h2>
      <div id="chat" class="msgs" aria-live="polite"></div>
      <form class="bar" id="cf"><input id="ci" placeholder="Écrire un message" maxlength="1000" autocomplete="off"><button>Envoyer</button></form>
    </section>
    <section id="p2" class="pane hide">
      <h2>Publications</h2>
      <div id="wall">
        <form class="post" id="pf"><textarea id="pi" placeholder="Partager quelque chose avec l’équipe" maxlength="5000"></textarea><div style="margin-top:.5rem;display:flex;gap:.4rem"><button>Publier</button></div></form>
        <div id="posts" style="display:grid;gap:1rem"></div>
      </div>
    </section>
    <section id="p4" class="pane hide"><h2>Membres</h2><div style="padding:.75rem 1.25rem"><input id="ms" placeholder="Rechercher un membre"></div><div id="ml" class="mlist"></div></section>
    <section id="p3" class="pane dm hide">
      <div id="peers"><h2>Messages privés</h2><input id="ps" placeholder="Chercher un collègue"><div id="pl"></div></div>
      <div id="conv">
        <div id="ch"><button class="g" id="back" type="button">Retour</button><span id="cn">Choisissez un collègue</span></div>
        <div id="dc" class="msgs"></div>
        <form class="bar hide" id="df"><input id="di" placeholder="Écrire un message privé" maxlength="1000" autocomplete="off"><button>Envoyer</button></form>
      </div>
    </section>
  </main>
</div>

<dialog id="pd">
  <div style="display:flex;align-items:center;gap:.8rem"><span id="prev"></span><div><strong>Mon profil</strong><div class="who">Photo ou emoji, au choix</div></div></div>
  <input type="file" id="pf0" accept="image/*" style="margin-top:.8rem">
  <div class="er" id="er"></div>
  <input id="pn" placeholder="Votre nom" maxlength="40">
  <input id="pa" placeholder="Poste ou courte présentation" maxlength="120" style="margin-top:.5rem">
  <div class="who" style="margin-top:.6rem">Votre e-mail : <b id="pe"></b></div>
  <label class="who" style="display:flex;gap:.5rem;align-items:center;margin-top:.3rem"><input type="checkbox" id="pse" style="width:auto"> Montrer mon e-mail à mes collègues</label>
  <div style="display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap">
    <button id="sv">Enregistrer</button><button class="g" id="rm" type="button">Retirer la photo</button><button class="g" id="cl" type="button">Fermer</button><button class="g" id="out" type="button" style="margin-left:auto">Se déconnecter</button>
  </div>
</dialog>
<dialog id="md">
  <div style="display:flex;gap:.8rem;align-items:center"><span id="mdav"></span><div><strong id="mdn" style="font-size:1.1rem"></strong><div class="who" id="mdi"></div></div></div>
  <p id="mda" style="margin:.8rem 0 .4rem"></p>
  <div class="who" id="mde"></div><div class="who" id="mds"></div>
  <div id="mdx" style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem"></div>
  <div style="margin-top:.8rem"><button class="g" id="mdc" type="button">Fermer</button></div>
</dialog>
<dialog id="lb"><img alt=""></dialog>
<div id="ep" class="hide"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const APP_NAME='Ray Com 2.0';
const SUPABASE_URL='https://odghpbzjaruupkbligmh.supabase.co';
const SUPABASE_KEY='sb_publishable_r-9HVWtfJJyrcPj4NoCrnw_sxbpvNLa';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
let me=null,P={},isAdmin=false,signup=false,started=false,dms=[],peer=null,seen={},ct=[];
try{seen=JSON.parse(localStorage.getItem('seen')||'{}')}catch(e){}

document.title=APP_NAME;
document.querySelectorAll('.an').forEach(e=>e.textContent=APP_NAME);
const LOGO='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Ray Com 2.0"><defs><linearGradient id="GID" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa2ff"/><stop offset="1" stop-color="#1a3aa6"/></linearGradient></defs><circle cx="32" cy="32" r="32" fill="url(#GID)"/><path d="M18 20q0-6 6-6h16q6 0 6 6v14q0 6-6 6h-9l-8 7v-7q-5 0-5-6z" fill="#fff"/><path fill-rule="evenodd" fill="#1a3aa6" d="M26 19h7.5c3.6 0 5.8 2 5.8 5 0 2.4-1.4 4-3.6 4.7L40 35h-4l-3.2-5h-3.3v5H26zM29.5 22v5h3.7c1.6 0 2.4-.9 2.4-2.5S34.8 22 33.2 22z"/><circle cx="50" cy="14" r="6" fill="#f5b942"/></svg>';
['lg0','lg1'].forEach((i,n)=>$('#'+i).innerHTML=LOGO.replace(/GID/g,'g'+n));
{const ic=document.createElement('link');ic.rel='icon';ic.href='data:image/svg+xml,'+encodeURIComponent(LOGO.replace(/GID/g,'gf'));document.head.append(ic)}

function h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
const when=t=>new Date(t).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
const nm=id=>(P[id]&&P[id].name)||'Collègue';
function whoEl(id,t){const d=h('div','who');d.append(h('b','nm',nm(id)),' · '+when(t));return d}
function imgEl(u){if(!u||!u.startsWith(SUPABASE_URL))return null;const i=h('img','pic');i.src=u;i.alt='Photo';i.loading='lazy';i.onclick=()=>{$('#lb img').src=u;$('#lb').showModal()};return i}
$('#lb').onclick=()=>$('#lb').close();
function shrinkImg(file,max){return new Promise((ok,ko)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):ko(),'image/jpeg',.78)};i.onerror=ko;i.src=URL.createObjectURL(file)})}
const att={},chips={};
function clr(k){delete att[k];if(chips[k])chips[k].classList.add('hide')}
function addPhoto(form,key,before){
  const b=h('button','em','📷'),f=h('input'),c=h('span','pc hide');
  b.type='button';b.title='Envoyer une photo';f.type='file';f.accept='image/*';f.className='hide';chips[key]=c;
  f.onchange=async()=>{const x=f.files[0];f.value='';if(!x)return;try{att[key]=await shrinkImg(x,1280);c.textContent='📷 Photo jointe ✕';c.classList.remove('hide')}catch(e){alert('Image illisible.')}};
  c.onclick=()=>clr(key);b.onclick=()=>f.click();
  [c,b,f].forEach(e=>form.insertBefore(e,before));
}
async function up(k){
  const b=att[k];if(!b)return null;
  const p=me.id+'/'+crypto.randomUUID()+'.jpg',{error}=await sb.storage.from('photos').upload(p,b,{contentType:'image/jpeg'});
  if(error)throw error;clr(k);return sb.storage.from('photos').getPublicUrl(p).data.publicUrl;
}
function say(t,ok){const m=$('#msg');m.textContent=t;m.className=ok?'ok':''}

/* Avatars */
function avx(a,name,id,size){
  const d=h('span','av');d.style.setProperty('--s',(size||36)+'px');
  if(a&&a.startsWith('data:')){const i=h('img');i.src=a;i.alt='';d.append(i)}
  else if(a){d.textContent=a;d.classList.add('e')}
  else{let s=0;for(const c of String(id))s+=c.charCodeAt(0);d.textContent=(name||'?').trim()[0].toUpperCase();d.style.background='hsl('+(s%360)+' 45% 36%)'}
  return d;
}
const av=(id,size)=>avx(P[id]&&P[id].avatar,nm(id),id,size);

/* Connexion */
$('#swap').onclick=()=>{
  signup=!signup;
  $('#name').classList.toggle('hide',!signup);$('#code').classList.toggle('hide',!signup);
  $('#name').required=signup;$('#code').required=signup;
  $('#go').textContent=signup?'Créer mon compte':'Se connecter';
  $('#swap').textContent=signup?'J’ai déjà un compte':'Pas encore de compte ? Créer un compte';
  say('');
};
$('#f').onsubmit=async e=>{
  e.preventDefault();say('');
  const email=$('#email').value.trim(),password=$('#pw').value;
  if(signup){
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{name:$('#name').value.trim(),code:$('#code').value.trim()}}});
    if(error)return say(/database error/i.test(error.message)?'Code d’accès incorrect ou inscription refusée.':error.message);
    if(!data.session)return say('Compte créé. Confirmez votre e-mail, puis connectez-vous.',true);
  }else{
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error)say('E-mail ou mot de passe incorrect.');
  }
};
$('#out').onclick=()=>{$('#pd').close();sb.auth.signOut()};
sb.auth.onAuthStateChange((_e,s)=>{
  setTimeout(()=>{
    if(s&&s.user){me=s.user;start()}
    else{me=null;started=false;sb.removeAllChannels();$('#app').classList.add('hide');$('#auth').classList.remove('hide')}
  },0);
});
sb.auth.getSession().then(({data})=>{if(!data.session)$('#auth').classList.remove('hide')});

/* Profils (mis en cache pour économiser la bande passante) */
async function sync(){
  try{P=JSON.parse(localStorage.getItem('pv2')||'{}')}catch(e){P={}}
  let last=localStorage.getItem('pv2t')||'1970-01-01T00:00:00Z';
  const {data}=await sb.from('profiles').select('id,name,avatar,is_admin,updated_at,about,show_email,created_at').gt('updated_at',last);
  (data||[]).forEach(p=>{P[p.id]={name:p.name,avatar:p.avatar,admin:p.is_admin,about:p.about,show:p.show_email,since:p.created_at};if(p.updated_at>last)last=p.updated_at});
  try{localStorage.setItem('pv2',JSON.stringify(P));localStorage.setItem('pv2t',last)}catch(e){}
}
function chip(){const c=$('#chip');c.replaceChildren(av(me.id,30),h('span','',nm(me.id)))}

async function start(){
  if(started)return;started=true;
  $('#auth').classList.add('hide');$('#app').classList.remove('hide');
  await sync();isAdmin=!!(P[me.id]&&P[me.id].admin);chip();
  await Promise.all([loadChat(),loadPosts(),loadDms(),loadContacts()]);
  sb.channel('live')
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},async p=>{if(!P[p.new.user_id])await sync();addMsg(p.new,true)})
   .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},p=>{const x=document.querySelector('[data-id="'+p.old.id+'"]');if(x)x.remove()})
   .on('postgres_changes',{event:'*',schema:'public',table:'posts'},loadPosts)
   .on('postgres_changes',{event:'*',schema:'public',table:'comments'},loadPosts)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'dms'},p=>gotDm(p.new))
   .on('postgres_changes',{event:'*',schema:'public',table:'contacts'},loadContacts)
   .subscribe();
}

/* Onglets */
function tab(n){
  [1,2,3,4].forEach(i=>{$('#p'+i).classList.toggle('hide',i!==n);$('#t'+i).classList.toggle('on',i===n)});
  if(n===1){const c=$('#chat');c.scrollTop=c.scrollHeight}
  if(n===3){renderPeers();if(peer)markSeen(peer)}
  if(n===4)renderMembers();
}
[1,2,3,4].forEach(i=>$('#t'+i).onclick=()=>tab(i));
$('#chip').onclick=()=>{draft=(P[me.id]&&P[me.id].avatar)||'';$('#pn').value=nm(me.id);$('#pa').value=(P[me.id]&&P[me.id].about)||'';$('#pe').textContent=me.email;$('#pse').checked=!!(P[me.id]&&P[me.id].show);drawPrev();$('#pd').showModal()};

/* Emojis */
const EM='😀😁😂🤣😊😍🥰😎🤔😅😭😡👍👎👏🙏💪🎉🔥✨❤️💙✅❌⚠️📌📎📅☕🍀🌟🚀👀🤝🙌😴🤯🥳😉😇🙂🙃😬😮😢🤗'.match(/\p{Extended_Pictographic}\uFE0F?/gu);
let emT=null;
EM.forEach(e=>{const b=h('button','',e);b.type='button';b.onclick=()=>{if(emT){emT.value+=e;emT.focus()}$('#ep').classList.add('hide')};$('#ep').append(b)});
function emBtn(input){
  const b=h('button','em','😊');b.type='button';b.title='Emojis';
  b.onclick=ev=>{ev.stopPropagation();emT=input;const r=b.getBoundingClientRect(),ep=$('#ep');ep.classList.remove('hide');
    ep.style.left=Math.max(4,Math.min(r.left,innerWidth-280))+'px';ep.style.bottom=(innerHeight-r.top+6)+'px'};
  return b;
}
document.addEventListener('click',e=>{if(!e.target.closest('#ep'))$('#ep').classList.add('hide')});
$('#cf').insertBefore(emBtn($('#ci')),$('#cf button'));
$('#df').insertBefore(emBtn($('#di')),$('#df button'));
$('#pf div').prepend(emBtn($('#pi')));
addPhoto($('#cf'),'c',$('#cf button:not(.em)'));
addPhoto($('#df'),'d',$('#df button:not(.em)'));
addPhoto($('#pf div'),'p',$('#pf div button:not(.em)'));

/* Discussion générale */
function addMsg(m,scroll){
  const c=$('#chat');
  if(document.querySelector('[data-id="'+m.id+'"]'))return;
  const e0=c.querySelector('.empty');if(e0)e0.remove();
  const mine=m.user_id===me.id,d=h('div','m'+(mine?' me':''));d.dataset.id=m.id;
  const b=h('div','mb');
  b.append(whoEl(m.user_id,m.created_at));if(m.content)b.append(h('div','',m.content));{const pi=imgEl(m.image);if(pi)b.append(pi)}
  if(mine||isAdmin){const x=h('button','g','Supprimer');x.onclick=()=>sb.from('messages').delete().eq('id',m.id).then(()=>d.remove());b.append(x)}
  d.append(av(m.user_id,34),b);
  const near=c.scrollHeight-c.scrollTop-c.clientHeight<120;
  c.append(d);if(scroll&&(near||mine))c.scrollTop=c.scrollHeight;
}
async function loadChat(){
  const {data}=await sb.from('messages').select('*').order('created_at',{ascending:false}).limit(80);
  const c=$('#chat');c.replaceChildren();
  (data||[]).reverse().forEach(m=>addMsg(m));
  if(!data||!data.length)c.append(h('div','empty','Aucun message. Écrivez le premier.'));
  c.scrollTop=c.scrollHeight;
}
$('#cf').onsubmit=async e=>{
  e.preventDefault();
  const t=$('#ci').value.trim();if(!t&&!att.c)return;let image=null;try{image=await up('c')}catch(x){return alert('Photo non envoyée : '+x.message)}
  $('#ci').value='';
  const {error}=await sb.from('messages').insert({content:t,image});
  if(error)alert('Message non envoyé : '+error.message);
};

/* Publications */
async function loadPosts(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('#posts')&&a.value)return;
  const {data}=await sb.from('posts').select('*,comments(*)').order('created_at',{ascending:false}).limit(30);
  const box=$('#posts');box.replaceChildren();
  if(!data||!data.length){box.append(h('div','empty','Aucune publication pour le moment.'));return}
  for(const p of data){
    const d=h('article','post'),hd=h('div','ph'),w=h('div');
    w.append(h('strong','',nm(p.user_id)),h('div','who',when(p.created_at)));
    hd.append(av(p.user_id,40),w);
    d.append(hd);if(p.content)d.append(h('p','',p.content));{const pi=imgEl(p.image);if(pi)d.append(pi)}
    if(p.user_id===me.id||isAdmin){
      const x=h('button','g','Supprimer la publication');
      x.onclick=()=>confirm('Supprimer cette publication ?')&&sb.from('posts').delete().eq('id',p.id);
      d.append(x);
    }
    (p.comments||[]).sort((a,b)=>a.created_at<b.created_at?-1:1).forEach(c=>{
      const k=h('div','cm'),b=h('div');
      b.append(whoEl(c.user_id,c.created_at),h('div','',c.content));
      if(c.user_id===me.id||isAdmin){const x=h('button','g','Supprimer');x.onclick=()=>sb.from('comments').delete().eq('id',c.id);b.append(x)}
      k.append(av(c.user_id,26),b);d.append(k);
    });
    const f=h('form','cform'),i=h('input');i.placeholder='Écrire un commentaire';i.maxLength=1000;
    f.append(i,emBtn(i),h('button','','Commenter'));
    f.onsubmit=async e=>{e.preventDefault();const t=i.value.trim();if(!t)return;i.value='';await sb.from('comments').insert({post_id:p.id,content:t})};
    d.append(f);box.append(d);
  }
}
$('#pf').onsubmit=async e=>{
  e.preventDefault();
  const t=$('#pi').value.trim();if(!t&&!att.p)return;let image=null;try{image=await up('p')}catch(x){return alert('Photo non envoyée : '+x.message)}
  const {error}=await sb.from('posts').insert({content:t,image});
  if(error)return alert('Publication non envoyée : '+error.message);
  $('#pi').value='';
};

/* Messages privés */
const other=d=>d.sender===me.id?d.recipient:d.sender;
const unread=o=>dms.filter(d=>d.sender===o&&d.created_at>(seen[o]||'')).length;
function markSeen(o){
  const l=dms.filter(d=>other(d)===o).map(d=>d.created_at).sort().pop();
  if(l){seen[o]=l;try{localStorage.setItem('seen',JSON.stringify(seen))}catch(e){}}
  badge();renderPeers();
}
function badge(){
  const n=Object.keys(P).reduce((s,o)=>s+(o===me.id?0:unread(o)),0)+ct.filter(c=>c.addressee===me.id&&c.status==='pending').length,b=$('#bd');
  b.textContent=n;b.classList.toggle('hide',!n);
}
async function loadDms(){
  const {data}=await sb.from('dms').select('*').order('created_at',{ascending:false}).limit(500);
  dms=(data||[]).reverse();badge();
}
function renderPeers(){
  const q=$('#ps').value.trim().toLowerCase(),box=$('#pl');box.replaceChildren();
  const last={};dms.forEach(d=>last[other(d)]=d);reqRows(box);
  contactIds().filter(id=>nm(id).toLowerCase().includes(q))
   .sort((a,b)=>(last[b]?last[b].created_at:'').localeCompare(last[a]?last[a].created_at:'')||nm(a).localeCompare(nm(b)))
   .forEach(id=>{
     const b=h('button','pr'+(id===peer?' on':'')),t=h('div'),n=unread(id);
     t.append(h('div','',nm(id)));if(last[id])t.append(h('small','',(last[id].sender===me.id?'Vous : ':'')+(last[id].content||'📷 Photo')));
     b.append(av(id,38),t);
     if(n)b.append(h('b','badge',n));
     b.onclick=()=>openPeer(id);box.append(b);
   });
  if(!box.children.length)box.append(h('div','empty','Aucun contact pour le moment. Envoyez une demande depuis l’onglet Membres.'));
}
$('#ps').oninput=renderPeers;
function bubble(d){
  if(document.querySelector('[data-d="'+d.id+'"]'))return;
  const c=$('#dc'),b=h('div','b'+(d.sender===me.id?' me':''));b.dataset.d=d.id;
  if(d.content)b.append(h('div','',d.content));{const pi=imgEl(d.image);if(pi)b.append(pi)}b.append(h('div','who',when(d.created_at)));
  c.append(b);c.scrollTop=c.scrollHeight;
}
function openPeer(id){
  peer=id;$('#p3').classList.add('open');
  const ch=$('#ch');ch.replaceChildren($('#back'),av(id,32),h('span','',nm(id)));
  $('#df').classList.remove('hide');
  const c=$('#dc');c.replaceChildren();
  const l=dms.filter(d=>other(d)===id);l.forEach(bubble);
  if(!l.length)c.append(h('div','empty','Aucun message. Dites bonjour.'));
  markSeen(id);$('#di').focus();
}
$('#back').onclick=()=>{peer=null;$('#p3').classList.remove('open');renderPeers()};
async function gotDm(d){
  if(dms.some(x=>x.id===d.id))return;
  dms.push(d);const o=other(d);if(!P[o])await sync();
  if(peer===o&&!$('#p3').classList.contains('hide')){const e0=$('#dc .empty');if(e0)e0.remove();bubble(d);markSeen(o)}
  else{badge();renderPeers()}
}
$('#df').onsubmit=async e=>{
  e.preventDefault();
  const t=$('#di').value.trim();if((!t&&!att.d)||!peer)return;let image=null;try{image=await up('d')}catch(x){return alert('Photo non envoyée : '+x.message)}
  $('#di').value='';
  const {data,error}=await sb.from('dms').insert({recipient:peer,content:t,image}).select().single();
  if(error)return alert('Message non envoyé : '+error.message);
  gotDm(data);
};

/* Membres et contacts */
const rel=id=>ct.find(c=>(c.requester===me.id&&c.addressee===id)||(c.requester===id&&c.addressee===me.id));
const contactIds=()=>ct.filter(c=>c.status==='accepted').map(c=>c.requester===me.id?c.addressee:c.requester);
async function loadContacts(){
  const {data}=await sb.from('contacts').select('*');
  ct=data||[];badge();renderPeers();
  if($('#md').open)drawActions($('#md').dataset.id);
}
function reqRows(box){
  ct.filter(c=>c.addressee===me.id&&c.status==='pending').forEach(c=>{
    const d=h('div','pr'),t=h('div'),a=h('button','sm','Accepter'),n=h('button','g sm','Décliner');
    t.append(h('div','',nm(c.requester)),h('small','','Demande de contact'));
    a.onclick=()=>sb.from('contacts').update({status:'accepted'}).eq('id',c.id).then(loadContacts);
    n.onclick=()=>sb.from('contacts').delete().eq('id',c.id).then(loadContacts);
    d.append(av(c.requester,38),t,a,n);box.append(d);
  });
}
function renderMembers(){
  const q=$('#ms').value.trim().toLowerCase(),box=$('#ml');box.replaceChildren();
  Object.keys(P).sort((a,b)=>nm(a).localeCompare(nm(b))).filter(id=>nm(id).toLowerCase().includes(q)).forEach(id=>{
    const b=h('button','mr'),t=h('div'),n=h('div');
    n.append(nm(id));if(P[id].admin)n.append(h('span','tag','Admin'));if(id===me.id)n.append(h('span','tag','Vous'));
    t.append(n);if(P[id].about)t.append(h('small','',P[id].about));
    b.append(av(id,42),t);b.onclick=()=>openMember(id);box.append(b);
  });
  $('#p4 h2').textContent='Membres ('+Object.keys(P).length+')';
}
$('#ms').oninput=renderMembers;
function drawActions(id){
  const box=$('#mdx');box.replaceChildren();if(id===me.id)return;
  const r0=rel(id);
  const btn=(t,f,cls)=>{const b=h('button',cls||'',t);b.onclick=async()=>{b.disabled=true;const {error}=await f();if(error)alert(error.message);loadContacts()};box.append(b)};
  if(!r0)btn('Envoyer une demande de contact',()=>sb.from('contacts').insert({addressee:id}));
  else if(r0.status==='accepted'){
    const w=h('button','','Écrire un message');w.onclick=()=>{$('#md').close();tab(3);openPeer(id)};box.append(w);
    btn('Retirer des contacts',()=>sb.from('contacts').delete().eq('id',r0.id),'g');
  }else if(r0.addressee===me.id){
    btn('Accepter la demande',()=>sb.from('contacts').update({status:'accepted'}).eq('id',r0.id));
    btn('Décliner',()=>sb.from('contacts').delete().eq('id',r0.id),'g');
  }else btn('Demande envoyée · annuler',()=>sb.from('contacts').delete().eq('id',r0.id),'g');
}
async function openMember(id){
  const p=P[id]||{};
  $('#md').dataset.id=id;
  $('#mdav').replaceChildren(av(id,64));$('#mdn').textContent=nm(id);
  $('#mdi').textContent=(p.admin?'Administrateur':'Membre')+(id===me.id?' · c’est vous':'');
  $('#mda').textContent=p.about||'Aucune présentation.';
  $('#mds').textContent=p.since?'Membre depuis le '+new Date(p.since).toLocaleDateString('fr-FR'):'';
  $('#mde').textContent='E-mail : …';
  drawActions(id);$('#md').showModal();
  const {data}=await sb.from('emails').select('email').eq('id',id).maybeSingle();
  $('#mde').textContent=data?'E-mail : '+data.email:'E-mail : masqué par ce membre';
}
$('#mdc').onclick=()=>$('#md').close();

/* Crédits */
function credit(el){el.innerHTML='<div>Conçu et développé par <b>Joel NDRIAMPARANY</b></div><div><b>RAY DIGITAL SERVICE</b> · Assistance et développement</div><div><a href="mailto:inforayes@gmail.com">inforayes@gmail.com</a> · <a href="https://wa.me/261345250652" target="_blank" rel="noopener">WhatsApp 034 52 506 52</a></div>'}
[$('#auth'),$('aside'),$('#pd')].forEach(box=>{const x=h('div','credit');credit(x);box.append(x)});

/* Profil */
let draft='';
function drawPrev(){$('#prev').replaceChildren(avx(draft,$('#pn').value||nm(me.id),me.id,56))}
['😀','😎','🦁','🐯','🦊','🐼','🌟','🚀','🌿','☕','⚽','🎧'].forEach(e=>{
  const b=h('button','',e);b.type='button';b.onclick=()=>{draft=e;drawPrev()};$('#er').append(b);
});
$('#rm').onclick=()=>{draft='';drawPrev()};
$('#cl').onclick=()=>$('#pd').close();
$('#pn').oninput=drawPrev;
$('#pf0').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const i=new Image();
  i.onload=()=>{
    const s=Math.min(i.width,i.height),c=document.createElement('canvas');c.width=c.height=64;
    c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,64,64);
    draft=c.toDataURL('image/jpeg',.8);drawPrev();
  };
  i.src=URL.createObjectURL(f);
};
$('#sv').onclick=async()=>{
  const name=$('#pn').value.trim()||nm(me.id),about=$('#pa').value.trim()||null,show=$('#pse').checked;
  const {error}=await sb.from('profiles').update({name,avatar:draft||null,about,show_email:show}).eq('id',me.id);
  if(error)return alert('Profil non enregistré : '+error.message);
  P[me.id]={name,avatar:draft||null,admin:isAdmin,about,show,since:P[me.id]&&P[me.id].since};
  try{localStorage.setItem('pv2',JSON.stringify(P))}catch(e){}
  chip();$('#pd').close();loadChat();loadPosts();renderPeers();
};
</script>
